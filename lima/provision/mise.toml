# VM 内の ~/.config/mise/config.toml として配置される (lima の provision mode: data)。
# overwrite: true なので、このファイルが唯一の真実。VM 内で直接編集しても次回ブートで戻る。
# ツールを足すときはここに追記して `make reprovision` (または `make recreate`)。

[tools]
# Claude Code 本体とその実行に必要なもの
node    = "lts"
claude  = "latest"

# claude が多用する検索系 / GitHub 操作系 CLI
gh      = "latest"
ripgrep = "latest"
fd      = "latest"
jq      = "latest"

# ランタイム
python  = "3.13"
uv      = "latest"
go      = "latest"

[settings]
# ソースビルドを避けて precompiled ビルドを使う。初回ブートが数分短くなる。
python.compile = false
