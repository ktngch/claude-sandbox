# VM 内の ~/.config/mise/config.toml として配置される (lima の provision mode: data)。
# overwrite: true なので、このファイルが唯一の真実。VM 内で直接編集しても次回ブートで戻る。
# ツールを足すときはここに追記して `make reprovision` (または `make recreate`)。

[tools]
# Claude Code 本体とその実行に必要なもの
node    = "lts"
claude  = "latest"

# claude が多用する検索系 / GitHub 操作系 CLI
gh      = "latest"
ghq     = "latest" # clone 先を ~/workspace/github.com/owner/repo に整理する
ripgrep = "latest"
fd      = "latest"
jq      = "latest"

# シェルのプロンプト装飾。~/.bashrc への配線は 50-starship.sh
starship = "latest"

# ランタイム
python  = "3.13"
uv      = "latest"
go      = "latest"

# AWS。クレデンシャルは平文の ~/.aws/credentials ではなく aws-vault の
# file バックエンド (パスフレーズで暗号化) に置く。配線は 40-aws-vault.sh。
aws-vault = "latest" # aqua:ByteNess/aws-vault (abandoned な 99designs 版のメンテナンスフォーク)
awscli    = "latest"

[settings]
# ソースビルドを避けて precompiled ビルドを使う。初回ブートが数分短くなる。
python.compile = false
